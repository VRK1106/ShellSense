services:
  - type: web
    name: shellsense-web
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn shellsense.web.server:app --app-dir src --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: PYTHONPATH
        value: src

